name: Python Lint and Test
on: [pull_request]
permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "check" # Checks for logic errors
      - name: Run Ruff Format
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check" # Checks for style/pretty code

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r CookinBook/requirements.txt
      - name: Run tests
        run: |
          cd CookinBook
          python manage.py test
        env:
          GEMINI_API_KEY: "dummy-key-for-ci"    